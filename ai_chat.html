<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 专属营养师 - 沉浸式配餐</title>
    <style>
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }

        /* 左侧聊天区 */
        .chat-section { flex: 6; display: flex; flex-direction: column; background: white; border-right: 1px solid #e0e0e0; }
        .chat-header { padding: 20px; background: #4CAF50; color: white; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; margin-right: 15px; font-weight: bold; font-size: 14px; }
        .chat-history { flex: 1; padding: 20px; overflow-y: auto; background: #f9f9f9; scroll-behavior: smooth; }

        /* 聊天气泡 */
        .message { margin-bottom: 20px; display: flex; max-width: 85%; }
        .message.user { margin-left: auto; flex-direction: row-reverse; }
        .bubble { padding: 12px 18px; border-radius: 18px; line-height: 1.6; font-size: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); word-wrap: break-word; }
        .user .bubble { background: #4CAF50; color: white; border-top-right-radius: 2px; }
        .ai .bubble { background: white; color: #333; border-top-left-radius: 2px; border: 1px solid #eee; }

        /* 输入区 */
        .input-area { padding: 20px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 15px; border: 1px solid #ddd; border-radius: 30px; outline: none; font-size: 15px; transition: all 0.3s; }
        .input-area input:focus { border-color: #4CAF50; box-shadow: 0 0 5px rgba(76,175,80,0.2); }
        .input-area button { background: #4CAF50; color: white; border: none; padding: 0 25px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 15px; transition: transform 0.1s; }
        .input-area button:active { transform: scale(0.95); }

        /* 右侧展示区 */
        .visual-section { flex: 4; background: #fafafa; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .visual-header { text-align: center; color: #666; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px dashed #ddd; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; gap: 15px; transition: transform 0.3s; border: 1px solid transparent; }
        .card:hover { transform: translateY(-5px); border-color: #4CAF50; }
        .card img { width: 90px; height: 90px; border-radius: 10px; object-fit: cover; background: #eee; }
        .card-info { flex: 1; position: relative; }
        .card-info h4 { margin: 0 0 5px 0; color: #333; font-size: 17px; }
        .tag { display: inline-block; padding: 2px 8px; background: #e8f5e9; color: #4CAF50; border-radius: 10px; font-size: 11px; margin-bottom: 5px; }
        .price { color: #ff5722; font-weight: bold; font-size: 18px; position: absolute; right: 0; top: 0; }
        .nutrients { font-size: 12px; color: #888; background: #f5f5f5; padding: 6px; border-radius: 6px; margin-top: 8px; line-height: 1.4; }
        .action-btn { width: 100%; background: #ff9800; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 16px; display: none; box-shadow: 0 4px 10px rgba(255,152,0,0.3); }

        .loading { font-style: italic; color: #888; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="chat-section">
        <div class="chat-header">
            <button class="back-btn" onclick="window.location.href='index.html'">← 返回食堂</button>
            <h2 style="margin:0; font-size: 18px;">🪄 智慧食堂 AI 营养师 (LoRA 驱动)</h2>
        </div>

        <div class="chat-history" id="chatHistory">
            <div class="message ai">
                <div class="bubble">你好小钰！我是你的专属 AI 营养师。我已经学习了食堂的所有菜品知识。<br><br>你可以直接告诉我你的需求，比如：<br>“<strong>我想要一个 20 元左右的高蛋白午餐方案</strong>”<br>或者“<strong>帮我搭配一下今天的一日三餐，总热量控制在 1500 大卡。</strong>”</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="告诉 AI 你的需求..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <div class="visual-section">
        <div class="visual-header">
            <h3 style="margin:0;">🍽️ 方案菜品预览</h3>
            <p style="margin:5px 0 0 0; font-size: 12px;">AI 提到的菜品将在这里自动呈现卡片</p>
        </div>
        <div id="recommendationPanel">
            <div style="text-align: center; color: #ccc; margin-top: 80px;">
                <h1 style="font-size: 60px; margin: 0;">🥗</h1>
                <p>等待 AI 推荐菜品...</p>
            </div>
        </div>
        <button id="addToCartBtn" class="action-btn" onclick="acceptPlan()">采纳此方案并一键点单</button>
    </div>

    <script>
        // 🌟 统一使用 localhost，避免 127.0.0.1 导致的跨域拦截
        const API_BASE_URL = 'http://localhost:5000';
        let currentMenuData = [];

        // 初始化：获取当日菜单数据
        async function fetchMenuData() {
            const days = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
            const today = days[new Date().getDay()];
            try {
                const res = await fetch(`${API_BASE_URL}/api/menu?day=${today}`);
                currentMenuData = await res.json();
                console.log("✅ 成功同步今日菜单库:", currentMenuData);
            } catch(e) {
                console.error("❌ 菜单库同步失败，请检查后端:", e);
            }
        }

        window.onload = fetchMenuData;

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // 渲染消息气泡
        function appendBubble(role, htmlContent, id = '') {
            const history = document.getElementById('chatHistory');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            if(id) msgDiv.id = id;
            msgDiv.innerHTML = `<div class="bubble">${htmlContent}</div>`;
            history.appendChild(msgDiv);
            history.scrollTop = history.scrollHeight;
        }

        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text) return;

            appendBubble('user', text);
            inputEl.value = '';

            const loadingId = 'loading-' + Date.now();
            appendBubble('ai', '<span class="loading">🤖 AI 营养师正在思考配餐逻辑...</span>', loadingId);

            const days = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
            const today = days[new Date().getDay()];

            try {
                // 如果菜单没加载，临时补救
                if (currentMenuData.length === 0) await fetchMenuData();

                const res = await fetch(`${API_BASE_URL}/api/ai_plan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, day: today })
                });
                const data = await res.json();

                document.getElementById(loadingId).remove();

                if (data.status === 'success') {
                    // 处理换行符，让 AI 的回复排版更漂亮
                    let formattedReason = data.reason.replace(/\n/g, '<br>');
                    appendBubble('ai', formattedReason);

                    // 渲染右侧卡片
                    renderCards(data.recommended_ids);
                } else {
                    appendBubble('ai', `⚠️ 助手遇到了一点小麻烦：${data.message}`);
                }
            } catch (err) {
                if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                appendBubble('ai', `❌ 无法连接到 AI 大脑，请确认后端 app.py 是否正在运行。`);
            }
        }

        function renderCards(ids) {
            const panel = document.getElementById('recommendationPanel');
            const actionBtn = document.getElementById('addToCartBtn');
            panel.innerHTML = '';

            if (!ids || ids.length === 0) {
                panel.innerHTML = '<p style="text-align:center; color:#999; margin-top:50px;">AI 本次回复中未提及具体菜品编号。</p>';
                actionBtn.style.display = 'none';
                return;
            }

            let totalPrice = 0;
            let totalCal = 0;
            let foundCount = 0;

            ids.forEach(id => {
                // 🌟 核心修复：强行转数字比对，解决 ID 格式不统一导致的“卡片不显示”
                const item = currentMenuData.find(i => Number(i.id) === Number(id));
                if (item) {
                    foundCount++;
                    totalPrice += item.price;
                    totalCal += item.calories;

                    panel.innerHTML += `
                        <div class="card">
                            <img src="${item.image || 'https://via.placeholder.com/100'}" alt="${item.name}">
                            <div class="card-info">
                                <span class="price">¥${item.price.toFixed(1)}</span>
                                <h4>${item.name}</h4>
                                <span class="tag">${item.category}</span>
                                <div class="nutrients">🔥 热量: ${item.calories} kcal<br>🥩 蛋白: ${item.protein}g | 🍞 碳水: ${item.carbs}g</div>
                            </div>
                        </div>
                    `;
                }
            });

            if (foundCount > 0) {
                panel.innerHTML = `
                    <div style="background:#e8f5e9; padding:12px; border-radius:12px; margin-bottom:20px; color:#2e7d32; font-weight:bold; text-align:center; border: 1px solid #c8e6c9;">
                        📊 方案总计：¥${totalPrice.toFixed(1)} | ${totalCal} kcal
                    </div>
                ` + panel.innerHTML;
                actionBtn.style.display = 'block';
            } else {
                panel.innerHTML = '<p style="text-align:center; color:#999; margin-top:50px;">AI 提到的菜品 ID 在今日菜单库中未找到。</p>';
                actionBtn.style.display = 'none';
            }
        }

        function acceptPlan() {
            // 这里可以添加逻辑：将推荐的菜品自动加入购物车
            alert("✅ 方案已采纳！由于这是 AI 推荐，请回到主页在菜单中手动勾选这几道菜完成下单。");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
